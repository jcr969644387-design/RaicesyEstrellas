name: raices_y_estrellas
description: "Raíces y Estrellas: Un viaje personal de 30 días. App de bienestar y crecimiento personal, offline y privada."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.3
  audioplayers: ^6.5.0
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/content/
    - assets/images/
    - assets/audio/music/
    - assets/audio/nature/
    - assets/audio/effects/
