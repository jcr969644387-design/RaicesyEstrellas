name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build-apk:
    name: APK universal de release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/RaicesyEstrellasV1.0.0.apk
          ls -lh dist/RaicesyEstrellasV1.0.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RaicesyEstrellasV1.0.0
          path: dist/RaicesyEstrellasV1.0.0.apk
          if-no-files-found: error
          compression-level: 0
